  name: smaller box of evil replicas
  description: A box full of replicas of memorabilias collected from evil do-no-gooders; second and smaller edition!
  suffix: Filled
  components:
  - type: StorageFill
    contents:
      - id: PlushieBingle
      - id: SyndieTrickyBomb
        amount: 2
      - id: FoamWonderprod
      - id: ClothingCostumeAbductorHead
      - id: ClothingCostumeAbductor
      - id: PlushieBingle
      - id: ClothingNeckCloakVoid
      - id: ToyEnergyKatana
      - id: PlushieDragon
      - id: PlushieCarp
        amount: 4
  - type: Sprite
    sprite: _Goobstation/AntagToys/antag_toy_crate_box.rsi
    layers:
    - state: crate
      map: ["enum.StorageVisualLayers.Base"]
    - state: crate_door
      map: ["enum.StorageVisualLayers.Door"]
    - state: welded
      visible: false
      map: ["enum.WeldableLayers.BaseWelded"]
    - state: paper
      map: ["enum.PaperLabelVisuals.Layer"]
  - type: Icon
    sprite: _Goobstation/AntagToys/antag_toy_crate_box.rsi
    state: crate_icon

